name: Assistant preview download

on:
  push:
    branches: [feat/embedded-editor-agent]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assistant-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.93.1
          components: clippy,rustfmt
      - run: cargo test --locked -p concat-agent
        working-directory: src
      - run: cargo clippy --locked -p concat-agent --all-targets -- -D warnings
        working-directory: src

  build:
    needs: agent-tests
    uses: ./.github/workflows/build-app.yml
    with:
      ref: ${{ github.sha }}

  download:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Concat-*
          path: installers
          merge-multiple: true
      - name: Publish tested preview installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="assistant-${COMMIT:0:12}"
          mapfile -d '' files < <(find installers -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.pkg.tar.zst' \) -print0)
          test "${#files[@]}" -gt 0
          sha256sum "${files[@]}" > installers/SHA256SUMS.txt
          gh release create "$tag" "${files[@]}" installers/SHA256SUMS.txt \
            --repo "$GH_REPO" --target "$COMMIT" --prerelease \
            --title "Concat — assistente de edição (prévia ${COMMIT:0:7})" \
            --notes "Prévia do assistente integrado: abra um projeto e use Assistente. Configure Ollama local ou um serviço compatível com OpenAI, envie um pedido, revise e aplique a proposta. As edições podem ser desfeitas. Modelos e chaves não estão incluídos. Os instaladores passaram pelas verificações de inicialização do fluxo Build app; a qualidade das respostas depende do modelo escolhido."
