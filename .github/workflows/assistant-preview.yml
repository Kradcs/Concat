name: Assistant preview download

on:
  push:
    branches: [feat/embedded-editor-agent]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assistant-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-tests:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            codex: codex-linux-x64
            executable: codex
            host: codex-code-mode-host
          - os: windows-2022
            codex: codex-windows-x64
            executable: codex.exe
            host: codex-code-mode-host.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.93.1
          components: clippy,rustfmt
      - name: Verify the native Codex package
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/fetch.sh '${{ matrix.codex }}' codex.tar.gz
          mkdir codex-test
          tar -xzf codex.tar.gz -C codex-test 'bin/${{ matrix.executable }}' 'bin/${{ matrix.host }}'
          echo "CONCAT_TEST_CODEX=$(pwd -W 2>/dev/null || pwd)/codex-test/bin/${{ matrix.executable }}" >> "$GITHUB_ENV"
      - run: cargo test --locked -p concat-agent
        working-directory: src
      - run: cargo clippy --locked -p concat-agent --all-targets -- -D warnings
        working-directory: src

  build:
    needs: agent-tests
    uses: ./.github/workflows/build-app.yml
    with:
      ref: ${{ github.sha }}
      targets: >-
        [{"platform": "windows", "arch": "x86_64", "os": "windows-2022", "target": "x86_64-pc-windows-msvc", "ffmpeg": "win64", "sherpa": "win-x64", "ort": "win-x64", "llvm": "win64", "vc": "x64", "inno": "x64compatible", "wix": "x64", "ggml": "variants"}]

  download:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Concat-*
          path: installers
          merge-multiple: true
      - name: Publish tested preview installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="assistant-${COMMIT:0:12}"
          mapfile -d '' files < <(find installers -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.pkg.tar.zst' \) -print0)
          test "${#files[@]}" -gt 0
          (cd installers; sha256sum -- *.exe *.msi) > installers/SHA256SUMS.txt
          gh release create "$tag" "${files[@]}" installers/SHA256SUMS.txt \
            --repo "$GH_REPO" --target "$COMMIT" --prerelease \
            --title "Concat — assistente de edição (prévia ${COMMIT:0:7})" \
            --notes "Assistente com login ChatGPT via Codex: abra um projeto, clique em Assistente e Entrar com ChatGPT. Conclua o login no navegador com sua conta Plus, envie o pedido, revise e aplique. Usa os limites de Codex da assinatura; não requer créditos de API. API e Ollama continuam opcionais. Edições podem ser desfeitas. Codex nativo incluído, sem Node.js. Testes de subprocesso, motor e inicialização Windows executados em CI; login e inferência com uma conta real precisam ser concluídos pelo usuário e não são testados automaticamente."
